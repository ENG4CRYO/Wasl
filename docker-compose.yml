version: "3.8"

services:
  wasl-api:
    image: ${DOCKER_USERNAME}/wasl-api:latest
    container_name: wasl_api_container
    restart: always
    ports:
      - "5060:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - JWT__Key=${JWT_SECRET_KEY}
      - DomainUrl=${DOMAIN_URL}
    networks:
      - wasl_network
    volumes:
      - ./WaslUploads:/app/wwwroot

networks:
  wasl_network:
    driver: bridge
