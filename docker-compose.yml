version: "3.8"

services:
  wasl-api:
    image: ${DOCKER_USERNAME}/wasl-api:latest
    container_name: wasl_api_container
    restart: always
    ports:
      - "5040:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - JWT__Key=${JWT_SECRET_KEY}
      - DomainUrl=${DOMAIN_URL}
    networks:
      - wasl_network
    volumes:
      - ./WaslUploads:/app/wwwroot

  redis:
    image: redis:7-alpine
    container_name: wasl_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: wasl_postgres
    environment:
      POSTGRES_DB: wasl_db
      POSTGRES_USER: wasl_user

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-WaslDB_SecretPass123!}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  wasl_network:
    driver: bridge
