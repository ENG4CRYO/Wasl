<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            margin: auto;
        }

        .otp-code {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            background: #ecf0f1;
            padding: 10px;
            text-align: center;
            letter-spacing: 5px;
            border-radius: 5px;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #7f8c8d;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: #2980b9;">Welcome to Wasl</h2>
        <p>You requested to register a new account. Please use the highly secure Verification Code below to complete your process:</p>

        <div class="otp-code">{{OtpCode}}</div>

        <p>This code will expire in <strong>10 minutes</strong>. If you did not request this, please ignore this email.</p>

        <div class="footer">
            &copy; 2026 Wasl Inc. All rights reserved.
        </div>
    </div>
</body>
</html>
