<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>رادار Wasl — بوابة السائق</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:,">
    <script type="module" src="js/main.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js" defer></script>
</head>
<body>

    <button id="langToggleBtn" class="lang-toggle-btn">
        English 🌐
    </button>

    <div id="toastContainer" role="status" aria-live="polite" aria-atomic="false"></div>

    <main id="loginScreen" class="login-wrapper" aria-labelledby="loginHeading">
        <div class="card login-card">
            <div class="login-brand">
                <span class="brand-icon" aria-hidden="true">🚕</span>
                <h1 id="loginHeading" class="login-title">Wasl</h1>
                <p class="login-subtitle" data-i18n="subtitle">بوابة السائق للمطورين</p>
            </div>

            <div class="input-group">
                <label for="email" data-i18n="emailLabel">البريد الإلكتروني</label>
                <input type="email" id="email" name="email" placeholder="driver@wasl.com" autocomplete="username" autocapitalize="off" spellcheck="false" required>
            </div>

            <div class="input-group">
                <label for="password" data-i18n="passwordLabel">كلمة المرور</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
                    <button type="button" class="btn-icon password-toggle" id="passwordToggle" aria-label="إظهار كلمة المرور" aria-pressed="false">
                        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" /></svg>
                    </button>
                </div>
            </div>

            <button class="btn btn-primary" id="loginBtn" type="button">
                <span class="btn-text" data-i18n="loginBtn">تسجيل الدخول</span>
                <span class="btn-spinner" aria-hidden="true" hidden></span>
            </button>
        </div>
    </main>

    <div id="dashboardScreen" class="dashboard-wrapper" hidden aria-label="لوحة تحكم السائق">
        <header class="dashboard-header">
            <div class="header-brand">
                <h2 class="header-title" data-i18n="radarTitle">🚕 رادار Wasl</h2>
                <span class="status-badge" id="statusBadge" role="status">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span id="statusText" data-i18n="connecting">جاري الاتصال…</span>
                </span>
            </div>
            <button class="btn btn-danger btn-sm" id="logoutBtn" type="button" aria-label="تسجيل الخروج">
                <span data-i18n="logoutBtn">خروج</span>
                <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></svg>
            </button>
        </header>

        <section class="card" aria-labelledby="locationHeading">
            <h3 class="card-title" id="locationHeading">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" /><circle cx="12" cy="10" r="3" /></svg>
                <span data-i18n="yourLocation">موقعك الحالي</span>
            </h3>
            <div class="row">
                <div class="col input-group">
                    <label for="lat">خط العرض (Lat)</label>
                    <input type="number" id="lat" value="33.3152" step="0.0001" min="-90" max="90">
                </div>
                <div class="col input-group">
                    <label for="lng">خط الطول (Lng)</label>
                    <input type="number" id="lng" value="44.3661" step="0.0001" min="-180" max="180">
                </div>
            </div>
            <p id="coordsHint" class="input-hint" data-i18n="locationHint">القيم الحالية تمثل موقع بغداد، العراق</p>
            <button class="btn btn-success" id="sendBtn" type="button">
                <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" /></svg>
                <span class="btn-text" data-i18n="updateLocationBtn">تحديث الموقع</span>
                <span class="btn-spinner" aria-hidden="true" hidden></span>
            </button>
        </section>

        <section class="card" aria-labelledby="opsHeading" aria-live="polite">
            <h3 class="card-title" id="opsHeading">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></svg>
                <span data-i18n="operationsPanel">لوحة العمليات</span>
            </h3>
            <div id="notificationsArea">
                <div id="emptyState" class="empty-state">
                    <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4"><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg>
                    <p data-i18n="waitingRides">متصل. في انتظار طلبات العملاء…</p>
                </div>
            </div>
        </section>
    </div>

    <div id="rideModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle" data-i18n="newRideReq">طلب رحلة جديد</h3>
                <span class="pulse-dot" aria-hidden="true"><span class="pulse-ring"></span><span class="pulse-core"></span></span>
            </div>
            <div class="modal-body" id="modalDesc">
                <div class="map-container" role="img">
                    <iframe id="modalMap" width="100%" height="100%" frameborder="0" loading="lazy"></iframe>
                </div>
                <div class="modal-details">
                    <div class="detail-row">
                        <span class="detail-icon detail-pickup" aria-hidden="true">●</span>
                        <div>
                            <span class="detail-label" data-i18n="pickupPoint">نقطة الانطلاق</span>
                            <span class="detail-value" id="modalPickup">—</span>
                        </div>
                    </div>
                    <div class="detail-row">
                        <span class="detail-icon detail-drop" aria-hidden="true">●</span>
                        <div>
                            <span class="detail-label" data-i18n="dropoffPoint">الوجهة النهائية</span>
                            <span class="detail-value" id="modalDrop">—</span>
                        </div>
                    </div>
                    <div class="detail-row">
                        <span class="detail-icon" aria-hidden="true" style="font-size: 1.1em;">💰</span>
                        <div>
                            <span class="detail-label" data-i18n="priceLabel">السعر التقديري</span>
                            <span class="detail-value" id="modalPrice" style="color: #28a745; font-weight: bold; font-size: 1.1em;">—</span>
                        </div>
                    </div>
                    <p class="ride-id-label" data-i18n="rideIdStr">رقم الرحلة: <code id="modalRideId"></code></p>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-success" id="modalAcceptBtn" type="button">
                    <span class="btn-text" data-i18n="acceptRideBtn">قبول الرحلة</span>
                    <span class="btn-spinner" aria-hidden="true" hidden></span>
                </button>
                <button class="btn btn-ghost" type="button" id="modalDismissBtn" data-i18n="ignoreBtn">تجاهل</button>
            </div>
        </div>
    </div>
</body>
</html>
